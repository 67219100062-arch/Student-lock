<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ยืมคืนกุญแจ</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Prompt", sans-serif;
            background: linear-gradient(135deg, #faf9ff, #f0edff);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* พื้นหลังตกแต่ง */
        body::before {
            content: "";
            position: fixed;
            width: 420px;
            height: 420px;
            background: #e8e2ff;
            border-radius: 50%;
            left: -180px;
            bottom: -130px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 360px;
            height: 360px;
            background: #ebe7ff;
            border-radius: 50%;
            right: -120px;
            bottom: 50px;
            z-index: -1;
        }

        /* กล่องหลัก */
        .register-card {
            width: 530px;
            background: #ffffff;
            border-radius: 30px;
            padding: 45px 55px 35px;
            box-shadow: 0 20px 55px rgba(75, 57, 145, 0.14);
        }

        /* Logo */
        .logo {
            width: 95px;
            height: 95px;
            margin: 0 auto 20px;
            background: #f0ecff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6842e8;
            font-size: 42px;
        }

        /* หัวข้อ */
        .title {
            text-align: center;
            color: #202451;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #77758a;
            font-size: 15px;
            font-weight: 400;
        }

        .description {
            text-align: center;
            color: #a09dad;
            font-size: 13px;
            font-weight: 300;
            margin-top: 5px;
        }

        /* เส้นคั่น */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0 25px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #e8e5f1;
            flex: 1;
        }

        .divider i {
            color: #6b42e8;
            font-size: 8px;
        }

        /* กลุ่มช่อง */
        .form-group {
            margin-bottom: 20px;
        }

        /* Label */
        .form-label {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #3e3b50;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        /* ไอคอนหน้า Label */
        .form-label i {
            width: 19px;
            color: #7046e8;
            font-size: 14px;
            text-align: center;
        }

        /* Input */
        .input-box {
            width: 100%;
            height: 52px;
            border: 1.5px solid #ddd9e9;
            border-radius: 13px;
            padding: 0 16px;
            font-family: "Prompt", sans-serif;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: 0.25s;
            background: #fff;
        }

        .input-box::placeholder {
            color: #aaa7b7;
        }

        .input-box:focus {
            border-color: #7046e8;
            box-shadow: 0 0 0 4px rgba(112, 70, 232, 0.08);
        }

        /* แถวรหัส + ห้อง */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Select */
        select.input-box {
            cursor: pointer;
            color: #77758a;
        }

        /* ปุ่ม */
        .register-btn {
            width: 100%;
            height: 58px;
            margin-top: 10px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #5b2be0, #8147f5);
            color: white;
            font-family: "Prompt", sans-serif;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: 0.25s;
            box-shadow: 0 8px 20px rgba(91, 43, 224, 0.20);
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(91, 43, 224, 0.28);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .register-btn i {
            font-size: 16px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 28px;
            color: #9794a7;
            font-size: 12px;
            font-weight: 300;
        }

        /* Responsive */
        @media (max-width: 600px) {

            body {
                padding: 20px;
                overflow: auto;
            }

            .register-card {
                width: 100%;
                padding: 35px 25px 30px;
            }

            .title {
                font-size: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

        }

    </style>
</head>


<body>

    <div class="register-card">

        <!-- Logo -->
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>


        <!-- Title -->
        <h1 class="title">
            ระบบ ยืม-คืน กุญแจ
        </h1>

        <p class="subtitle">
            กรอกข้อมูลให้ครบถ้วนเพื่อเข้าใช้งาน
        </p>

        <p class="description">
            โครงงานนักศึกษา • วิชาการพัฒนาเว็บไซต์
        </p>


        <!-- Divider -->
        <div class="divider">
            <i class="fa-solid fa-circle"></i>
        </div>


        <!-- Email -->
        <div class="form-group">

            <label class="form-label">
                <i class="fa-regular fa-envelope"></i>
                อีเมลวิทยาลัย
            </label>

            <input
                type="email"
                class="input-box"
                placeholder="email@minburi.ac.th"
            >

        </div>


        <!-- Name -->
        <div class="form-group">

            <label class="form-label">
                <i class="fa-regular fa-user"></i>
                ชื่อ - นามสกุล
            </label>

            <input
                type="text"
                class="input-box"
                placeholder="กรอกชื่อ - นามสกุล"
            >

        </div>


        <!-- Student ID + Classroom -->
        <div class="form-row">

            <!-- Student ID -->
            <div class="form-group">

                <label class="form-label">
                    <i class="fa-regular fa-id-card"></i>
                    รหัสนักศึกษา
                </label>

                <input
                    type="text"
                    class="input-box"
                    placeholder="672191"
                >

            </div>


            <!-- Classroom -->
            <div class="form-group">

                <label class="form-label">
                    <i class="fa-solid fa-school"></i>
                    ห้องเรียน
                </label>

                <select class="input-box">

                    <option value="">
                        เลือกห้องเรียน
                    </option>

                    <option>
                        ห้อง 121
                    </option>

                    <option>
                        ห้อง 122
                    </option>

                    <option>
                        ห้อง 124
                    </option>

                    <option>
                        ห้อง 125
                    </option>

                    <option>
                        ห้อง 141
                    </option>
                    <option>
                        ห้อง 142
                    </option>
                    <option>
                        ห้อง 143
                    </option>
                    <option>
                        ห้อง 144
                    </option>
                    <option>
                        ห้อง 145
                    </option>

                </select>

            </div>

        </div>


        <!-- Register Button -->
        <button class="register-btn">

            <i class="fa-solid fa-user-plus"></i>

            ลงทะเบียน

        </button>


        <!-- Footer -->
        <p class="footer">
            © 2026 ระบบยืม-คืนกุญแจ | วิทยาลัยเทคนิคมีนบุรี
        </p>

    </div>

</body>
</html>
