<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ยืมคืนกุญแจ</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="register-card">

        <!-- Progress dots -->
        <div class="progress-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>


        <!-- ============================
             SCREEN 1: REGISTER
        ============================ -->
        <div id="screen-register" class="screen active">

            <!-- Logo -->
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <!-- Title -->
            <h1 class="title">ยืมคืนกุญแจ</h1>
            <p class="subtitle">กรอกข้อมูลให้ครบถ้วนเพื่อเข้าใช้งาน</p>
            <p class="description">โครงงานนักศึกษา • วิชาการพัฒนาเว็บไซต์</p>

            <div class="divider">
                <i class="fa-solid fa-circle"></i>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="form-label" for="reg-email">
                    <i class="fa-regular fa-envelope"></i>
                    อีเมลวิทยาลัย
                </label>
                <input type="email" id="reg-email" class="input-box" placeholder="email@minburi.ac.th">
            </div>

            <!-- Name -->
            <div class="form-group">
                <label class="form-label" for="reg-name">
                    <i class="fa-regular fa-user"></i>
                    ชื่อ - นามสกุล
                </label>
                <input type="text" id="reg-name" class="input-box" placeholder="กรอกชื่อ - นามสกุล">
            </div>

            <!-- Student ID + Classroom -->
            <div class="form-row">

                <div class="form-group">
                    <label class="form-label" for="reg-id">
                        <i class="fa-regular fa-id-card"></i>
                        รหัสนักศึกษา
                    </label>
                    <input type="text" id="reg-id" class="input-box" placeholder="672191">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-room">
                        <i class="fa-solid fa-school"></i>
                        ห้องเรียน
                    </label>
                    <select id="reg-room" class="input-box">
                        <option value="">เลือกห้องเรียน</option>
                        <option value="121">ห้อง 121</option>
                        <option value="122">ห้อง 122</option>
                        <option value="124">ห้อง 124</option>
                        <option value="125">ห้อง 125</option>
                        <option value="141">ห้อง 141</option>
                        <option value="142">ห้อง 142</option>
                        <option value="143">ห้อง 143</option>
                        <option value="144">ห้อง 144</option>
                        <option value="145">ห้อง 145</option>
                    </select>
                </div>

            </div>

            <!-- Remember device -->
            <div class="checkbox-row">
                <input type="checkbox" id="remember-device">
                <label for="remember-device">จดจำอุปกรณ์นี้ 30 วัน (ข้ามการยืนยัน OTP ครั้งถัดไป)</label>
            </div>

            <!-- Register Button -->
            <button id="btn-register" class="register-btn" type="button">
                <i class="fa-solid fa-user-plus"></i>
                ลงทะเบียน
            </button>

            <p id="register-error" class="error-text"></p>

        </div>


        <!-- ============================
             SCREEN 2: OTP
        ============================ -->
        <div id="screen-otp" class="screen">

            <div class="logo">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <h1 class="title">ยืนยันตัวตน</h1>
            <p class="otp-hint">
                กรอกรหัส OTP 6 หลักที่ส่งไปยัง<br>
                <strong id="otp-email-target"></strong>
            </p>

            <div id="otp-inputs">
                <input type="text" inputmode="numeric" maxlength="1">
                <input type="text" inputmode="numeric" maxlength="1">
                <input type="text" inputmode="numeric" maxlength="1">
                <input type="text" inputmode="numeric" maxlength="1">
                <input type="text" inputmode="numeric" maxlength="1">
                <input type="text" inputmode="numeric" maxlength="1">
            </div>

            <button id="btn-verify" class="register-btn" type="button">
                <i class="fa-solid fa-check"></i>
                ยืนยัน
            </button>

            <p id="otp-error" class="error-text"></p>

            <p class="otp-resend">
                ไม่ได้รับรหัส?
                <button id="btn-resend" class="link-btn" type="button">ส่งรหัสอีกครั้ง</button>
            </p>

        </div>


        <!-- ============================
             SCREEN 3: SUCCESS
        ============================ -->
        <div id="screen-success" class="screen">

            <div class="success-icon">
                <i class="fa-solid fa-door-open"></i>
            </div>

            <h1 class="title">สำเร็จแล้ว!</h1>
            <p class="subtitle">ยืนยันตัวตนสำเร็จ กำลังสั่งเปิดประตู</p>

            <div id="device-remembered">
                <i class="fa-solid fa-shield-halved"></i>
                จดจำอุปกรณ์นี้ไว้แล้ว 30 วัน
            </div>

            <p id="connection-status" class="connection-status"></p>

            <button id="btn-continue" class="register-btn" type="button">
                <i class="fa-solid fa-rotate-left"></i>
                กลับไปหน้าลงทะเบียน
            </button>

        </div>


        <!-- Footer -->
        <p class="footer">© 2026 ระบบยืม-คืนกุญแจ | วิทยาลัยเทคนิคมีนบุรี</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
